server:
  port: 8080

spring:
  application:
    name: pdf-to-md
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  storage:
    directory: ../data/inbox
    base-url: http://localhost:8080
  links:
    enabled: true
    max-links: 5
    max-chars-per-link: 100000

openrouter:
  base-url: https://openrouter.ai/api/v1
  api-key: ${OPENROUTER_API_KEY:}
  model: openrouter/free
  max-output-tokens: 30000
  timeout-seconds: 600
  pdf-engine: mistral-ocr
  referer: http://localhost:8080
  title: pdf-to-md

logging:
  level:
    application: INFO
